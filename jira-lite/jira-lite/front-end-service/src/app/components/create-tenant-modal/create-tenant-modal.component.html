<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-panel" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h2 class="modal-title">Create workspace</h2>
      <button class="modal-close" (click)="closeModal()" [disabled]="loading()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label class="form-label">Workspace name</label>
        <input
          class="form-control"
          [class.is-invalid]="nameError"
          [(ngModel)]="name"
          placeholder="e.g. myteam"
          autofocus
          autocomplete="off"
          [disabled]="loading()"
        />
        <div *ngIf="nameError" class="field-error">{{ nameError }}</div>
        <div class="field-hint">Lowercase letters, digits, and underscores only. Min 3 characters.</div>
      </div>

      <div *ngIf="error()" class="alert-error">
        {{ error() }}
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeModal()" [disabled]="loading()">Cancel</button>
      <button class="btn btn-primary" (click)="submit()" [disabled]="!canSubmit">
        <span *ngIf="loading()" class="spinner"></span>
        <span>{{ loading() ? 'Creating…' : 'Create workspace' }}</span>
      </button>
    </div>

  </div>
</div>
