<header class="topbar">
  <div class="topbar-brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg>
    <span class="brand-name">JiraLite</span>
  </div>

  <nav class="topbar-nav">
    <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a *ngIf="!isPublicPage()" class="nav-item" routerLink="/projects" routerLinkActive="active">Projects</a>
    <a *ngIf="canManageUsers()" class="nav-item" routerLink="/users" routerLinkActive="active">Users</a>
    <a class="nav-item" routerLink="/profile" routerLinkActive="active">Profile</a>
    <a *ngIf="canManageUsers()" class="nav-item" routerLink="/admin/invite" routerLinkActive="active">Invite</a>
  </nav>

  <div class="topbar-actions">
    <a routerLink="/logout" class="btn-signout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Sign out
    </a>
  </div>
</header>
