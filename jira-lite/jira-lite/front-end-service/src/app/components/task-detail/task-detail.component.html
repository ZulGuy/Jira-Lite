<div class="page" *ngIf="task">
  <button class="back-btn" (click)="goBack()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to board
  </button>

  <div class="page-header">
    <div>
      <div class="issue-id">Issue #{{ task.id }}</div>
      <h1 class="page-title">{{ task.summary }}</h1>
    </div>
    <div class="header-actions">
      <span class="status-chip" [ngClass]="{
        'chip-todo':     task.status === 'TODO',
        'chip-progress': task.status === 'IN_PROGRESS',
        'chip-done':     task.status === 'DONE'
      }">{{ task.status === 'IN_PROGRESS' ? 'In Progress' : task.status === 'TODO' ? 'To Do' : 'Done' }}</span>
      <button *ngIf="canEdit" class="btn btn-primary btn-sm" (click)="save()">Save changes</button>
    </div>
  </div>

  <div class="detail-layout">
    <div class="detail-main">
      <div class="detail-section">
        <label class="form-label">Summary</label>
        <input class="form-control field-input" [(ngModel)]="task.summary" [readOnly]="!canEdit" />
      </div>
      <div class="detail-section">
        <label class="form-label">Description</label>
        <textarea class="form-control field-textarea" rows="5" [(ngModel)]="task.description" [readOnly]="!canEdit" placeholder="Add a description..."></textarea>
      </div>

      <div class="comments-section">
        <div class="section-title">Activity</div>

        <div *ngIf="canEdit" class="comment-composer">
          <textarea class="form-control" [(ngModel)]="newComment" rows="3" placeholder="Add a comment..."></textarea>
          <div class="composer-actions">
            <button class="btn btn-secondary btn-sm" (click)="addComment()">Save</button>
          </div>
        </div>

        <div class="comment-list">
          <div class="comment-item" *ngFor="let comment of comments">
            <div class="comment-header">
              <div class="comment-avatar">{{ comment.authorName?.charAt(0) }}</div>
              <span class="comment-author">{{ comment.authorName }}</span>
              <div class="comment-actions" *ngIf="canEdit">
                <button class="btn btn-outline-secondary btn-sm" (click)="editComment(comment)">Edit</button>
                <button class="btn btn-outline-danger btn-sm" (click)="deleteComment(comment.id)">Delete</button>
              </div>
            </div>
            <div class="comment-body">{{ comment.description }}</div>
          </div>
          <div *ngIf="comments.length === 0" class="no-comments">No comments yet</div>
        </div>
      </div>
    </div>

    <div class="detail-sidebar">
      <div class="sidebar-header">Details</div>

      <div class="sidebar-field">
        <div class="sidebar-label">Status</div>
        <select class="form-select" [(ngModel)]="task.status" [disabled]="!canEdit">
          <option value="TODO">To Do</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="DONE">Done</option>
        </select>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-field">
        <div class="sidebar-label">Assignee</div>
        <select class="form-select" [(ngModel)]="task.assigneeId" [disabled]="!canEdit">
          <option [ngValue]="null">Unassigned</option>
          <option *ngFor="let user of users" [ngValue]="user.id">{{ user.name }}</option>
        </select>
      </div>
      <div class="sidebar-field">
        <div class="sidebar-label">Reporter</div>
        <select class="form-select" [(ngModel)]="task.initiatorId" [disabled]="!canEdit">
          <option [ngValue]="null">Unassigned</option>
          <option *ngFor="let user of users" [ngValue]="user.id">{{ user.name }}</option>
        </select>
      </div>
    </div>
  </div>
</div>
