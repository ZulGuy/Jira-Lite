services:
  backend:
    build:
      context:
        ./back-end-service
    container_name: backend
    ports:
      - "8080:8080"
    env_file:
      - ./environment.env
    depends_on:
      db-jira-lite:
        condition: service_healthy
  frontend:
    build:
      context:
        ./front-end-service
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
  db-jira-lite:
    image: postgres:16-alpine
    container_name: db-jira-lite
    env_file:
      - ./environment.env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jira_lite"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
