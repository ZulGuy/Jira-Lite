services:
  backend:
    build:
      context:
        ./back-end-service
    container_name: backend
    ports:
      - "8080:8080"
    env_file:
      - ./environment.env
    depends_on:
      db-jira-lite:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/ -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  frontend:
    build:
      context:
        ./front-end-service
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
  db-jira-lite:
    image: postgres:16-alpine
    container_name: db-jira-lite
    env_file:
      - ./environment.env
    volumes:
      - ./back-end-service/src/main/resources/db/init.db.sql:/docker-entrypoint-initdb.d/init.db.sql
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jira_lite"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
