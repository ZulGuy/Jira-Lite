databaseChangeLog:

  # ═══════════════════════════════════════════════════════════════
  # 001 — public schema: full 10-table schema
  # ═══════════════════════════════════════════════════════════════
  - changeSet:
      id: 001-create-tables-public
      author: volodymyr
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE IF NOT EXISTS public.tennants (
                  id       SERIAL   PRIMARY KEY,
                  name     TEXT     NOT NULL UNIQUE,
                  status   BOOLEAN  NOT NULL DEFAULT TRUE,
                  admin_id INTEGER  UNIQUE
              );
              
              -- 1. Sentinel рядок для 'public' контексту
              INSERT INTO public.tennants (name, status, admin_id)
              VALUES ('public', TRUE, NULL)
              ON CONFLICT (name) DO NOTHING;
              
              CREATE TABLE IF NOT EXISTS public.users (
                  id          SERIAL       PRIMARY KEY,
                  email       TEXT         NOT NULL UNIQUE,
                  username    TEXT         NOT NULL UNIQUE,
                  password    TEXT         NOT NULL,
                  role        VARCHAR(50)  NOT NULL,
                  tenant_name TEXT         NOT NULL DEFAULT 'public'
                                           REFERENCES public.tennants(name),
                  active      BOOLEAN      NOT NULL DEFAULT TRUE
              );
              
              ALTER TABLE public.tennants
                ADD CONSTRAINT fk_tennants_admin_id
                FOREIGN KEY (admin_id) REFERENCES public.users(id)
                ON DELETE SET NULL;
              
              CREATE TABLE IF NOT EXISTS public.invitation_token (
                  id         SERIAL        PRIMARY KEY,
                  email      VARCHAR(255)  NOT NULL,
                  token      VARCHAR(255)  NOT NULL UNIQUE,
                  tennant    TEXT          REFERENCES public.tennants(name),
                  used       BOOLEAN       DEFAULT FALSE,
                  expires_at TIMESTAMP     NOT NULL
              );
              
              CREATE TABLE IF NOT EXISTS public.password_reset_tokens (
                  id          SERIAL        PRIMARY KEY,
                  user_id     INTEGER       NOT NULL UNIQUE REFERENCES public.users(id),
                  token       VARCHAR(255)  NOT NULL UNIQUE,
                  expiry_date TIMESTAMP     NOT NULL,
                  created_at  TIMESTAMP     DEFAULT NOW()
              );

  # ═══════════════════════════════════════════════════════════════════════════════
  # 002 — Indexes on schema
  # ═══════════════════════════════════════════════════════════════════════════════
  - changeSet:
      id: 002-add-indexes
      author: volodymyr
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- public
              CREATE INDEX IF NOT EXISTS idx_invitation_token_email_public  ON public.invitation_token(email);
              CREATE INDEX IF NOT EXISTS idx_users_email_public             ON public.users(email);
