spring.application.name=back-end-service
#Tenant DataSource Config
spring.datasource.tenant.url=${SPRING_DATASOURCE_URL}
spring.datasource.tenant.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.tenant.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.tenant.driver-class-name=org.postgresql.Driver

spring.datasource.tenant.hikari.maximum-pool-size=20
spring.datasource.tenant.hikari.minimum-idle=5
spring.datasource.tenant.hikari.connection-timeout=3000
spring.datasource.tenant.hikari.idle-timeout=600000

#Public DataSource Config
spring.datasource.public.url=${SPRING_DATASOURCE_URL}
spring.datasource.public.username=${SPRING_PUBLIC_DATASOURCE_USERNAME}
spring.datasource.public.password=${SPRING_PUBLIC_DATASOURCE_PASSWORD}
spring.datasource.public.driver-class-name=org.postgresql.Driver

spring.datasource.public.hikari.maximum-pool-size=20
spring.datasource.public.hikari.minimum-idle=5
spring.datasource.public.hikari.connection-timeout=3000
spring.datasource.public.hikari.idle-timeout=600000

#JPA/Hibernate Config
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.multiTenancy=SCHEMA
#spring.jpa.properties.hibernate.tenant_identifier_resolver=com.studying.backendservice.configurations.SchemaTenantIdentifierResolver
#spring.jpa.properties.hibernate.multi_tenant_connection_provider=com.studying.backendservice.configurations.SchemaMultiTenantConnectionProvider
#spring.jpa.properties.hibernate.show_sql=true
spring.jpa.open-in-view=false

#Liquibase Config
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

#JWT_SECRET
jwt.secret=${JWT_SECRET}

#Mail Config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.protocol=smtp
spring.mail.test-connection=false

#Other
spring.main.allow-circular-references=false

frontend.registration-link=${FRONTEND_REGISTRATION_LINK}

#Monitoring
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.applicatiom=${spring.application.name}
management.health.mail.enabled=false




